[project]
name = "usd-log-collector"
version = "0.1.0"
description = "Сбор логов Microsoft Dynamics 365 Unified Service Desk"
requires-python = ">=3.11,<3.15"
dependencies = ["PyQt5==5.15.11"]

[dependency-groups]
dev = ["mypy==2.4.1", "pytest==9.2.0", "ruff==0.17.4"]
build = ["pyinstaller==6.22.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["design.py", "design_about.py", "design_success.py", "main.spec"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
files = ["collector.py"]
strict = true
